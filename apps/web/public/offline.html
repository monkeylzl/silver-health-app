<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silver Health 离线</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: #17202a;
        background: #eef4f5;
      }
      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }
      section {
        max-width: 360px;
        border: 1px solid #dfe5e8;
        border-radius: 10px;
        padding: 20px;
        background: #fff;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #5d6b78;
        line-height: 1.7;
      }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 18px;
        border: 0;
        border-radius: 10px;
        background: #176b87;
        color: #fff;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>当前离线</h1>
        <p>现在无法连接网络。最近访问过的页面仍可只读查看，恢复网络后即可继续记录和更新。</p>
        <button type="button" onclick="location.reload()">重新连接</button>
      </section>
    </main>
  </body>
</html>
