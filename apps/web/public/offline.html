<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silver Health 离线</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: #101828;
        background: #fff;
      }
      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }
      section {
        max-width: 360px;
        border: 1px solid #eaecf0;
        border-radius: 16px;
        padding: 20px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #475467;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>当前离线</h1>
        <p>Silver Health 已经安装到本机，但现在无法连接网络。请恢复网络后重新打开今日、健康或家属页面。</p>
      </section>
    </main>
  </body>
</html>
